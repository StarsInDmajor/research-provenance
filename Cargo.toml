[workspace]
members = [
  "crates/rp-cli",
  "crates/rp-core",
  "crates/rp-fixture-test",
  "crates/rp-scale-generate",
  "crates/rp-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5.51", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
jiff = { version = "0.2.18", default-features = false, features = ["std"] }
jsonschema = { version = "0.54.0", default-features = false }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_jcs = "0.2.0"
serde_json = "1.0.145"
sha2 = "0.10.9"
rustix = { version = "1.1.2", default-features = false, features = ["fs", "std"] }
yaml-rust2 = { version = "0.10.4", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
